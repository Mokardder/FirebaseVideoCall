<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Caller (CDN Firebase + Vanilla JS)</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 860px; margin: 2rem auto; }
      video { width: 100%; max-width: 720px; background: #111; border-radius: 8px; }
      .row { display: flex; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
      input, button, select { padding: .6rem; }
      #fcmTopic, #fcmEndpoint { width: min(100%, 720px); }
      #log { white-space: pre-wrap; background: #f6f6f6; padding: .8rem; border-radius: 8px; min-height: 120px; }
      .note { font-size: .9rem; color: #444; margin: 0 0 1rem; }
    </style>
  </head>
  <body>
    <h1>Browser Caller (controls Android sender)</h1>

    <div class="row">
      <input id="callId" value="demo-call-001" />
      <label for="cameraSelect">Camera</label>
      <select id="cameraSelect">
        <option value="front" selected>Front</option>
        <option value="back">Back</option>
      </select>
      <button id="startBtn">Start Call</button>
      <button id="hangupBtn">Hangup</button>
    </div>

    <h3>Wake Android via FCM</h3>
    <p class="note">
      Use a secure backend endpoint (Cloud Function / server) that sends Firebase Cloud Messaging.
      Do not expose FCM server credentials in browser JavaScript.
    </p>
    <div class="row">
      <input id="fcmEndpoint" placeholder="https://YOUR_BACKEND/send-fcm" />
    </div>
    <div class="row">
      <input id="fcmTopic" value="video_call_android" placeholder="FCM topic (example: video_call_android)" />
      <button id="sendFcmBtn">Send FCM</button>
    </div>

    <div class="row">
      <button id="muteBtn" disabled>Mute Mic</button>
      <button id="torchBtn" disabled>Torch On</button>
    </div>

    <video id="remoteVideo" autoplay playsinline controls></video>
    <h3>Log</h3>
    <div id="log"></div>

    <!-- Firebase via CDN (no npm) -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
