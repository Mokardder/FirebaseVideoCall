<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Caller (Vanilla JS)</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 860px; margin: 2rem auto; }
      video { width: 100%; max-width: 720px; background: #111; border-radius: 8px; }
      .row { display: flex; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap; }
      input, button { padding: .6rem; }
      #log { white-space: pre-wrap; background: #f6f6f6; padding: .8rem; border-radius: 8px; min-height: 120px; }
    </style>
  </head>
  <body>
    <h1>Browser Caller (No local media, Vanilla JS)</h1>

    <div class="row">
      <input id="callId" value="demo-call-001" />
      <input id="dbUrl" value="https://YOUR_PROJECT-default-rtdb.firebaseio.com" style="min-width: 360px" />
    </div>
    <div class="row">
      <button id="startBtn">Start Call</button>
      <button id="hangupBtn">Hangup</button>
    </div>

    <video id="remoteVideo" autoplay playsinline controls></video>
    <h3>Log</h3>
    <div id="log"></div>

    <script src="./app.js"></script>
  </body>
</html>
