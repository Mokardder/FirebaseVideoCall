<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Caller (CDN Firebase + Vanilla JS)</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 860px; margin: 2rem auto; }
      video { width: 100%; max-width: 720px; background: #111; border-radius: 8px; }
      .row { display: flex; gap: .5rem; margin-bottom: 1rem; flex-wrap: wrap; }
      input, button { padding: .6rem; }
      #log { white-space: pre-wrap; background: #f6f6f6; padding: .8rem; border-radius: 8px; min-height: 120px; }
    </style>
  </head>
  <body>
    <h1>Browser Caller</h1>

    <div class="row">
      <input id="callId" value="demo-call-001" />
      <select id="mediaMode">
        <option value="front">Front camera + audio</option>
        <option value="back">Back camera + audio</option>
        <option value="audio">Only audio</option>
      </select>
      <label><input id="flashEnabled" type="checkbox" /> Flash/Torch</label>
      <button id="startBtn">Start Call</button>
      <button id="hangupBtn">Hangup</button>
    </div>

    <video id="localVideo" autoplay muted playsinline controls></video>
    <video id="remoteVideo" autoplay playsinline controls></video>
    <h3>Log</h3>
    <div id="log"></div>

    <!-- Firebase via CDN (no npm) -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
